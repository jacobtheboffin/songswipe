<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongSwipe - Music Ranking & Exploration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-music"></i> SongSwipe
            </h1>
            <nav class="flex gap-4">
                <button onclick="switchTab('home')" class="hover:text-emerald-400 font-medium">Home</button>
                <button onclick="switchTab('rank')" class="hover:text-emerald-400 font-medium">Rank</button>
                <button onclick="switchTab('explore')" class="hover:text-emerald-400 font-medium">Explore</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">

        <!-- Search Bar Section -->
        <section class="mb-8 relative">
            <div class="relative">
                <input 
                    type="text" 
                    id="artistSearchInput" 
                    placeholder="Search any artist (e.g., Radiohead, Taylor Swift)..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 pl-10 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 shadow-md"
                    oninput="handleSearchInput(event)"
                />
                <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
            </div>
            <!-- Search Results Dropdown -->
            <div id="searchResults" class="hidden absolute left-0 right-0 top-14 bg-slate-800 border border-slate-700 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto"></div>
        </section>

        <!-- Dynamic View Sections -->
        <div id="tab-home" class="view-tab space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center">
                <h2 class="text-3xl font-extrabold mb-2 text-white">Welcome to SongSwipe</h2>
                <p class="text-slate-400 max-w-lg mx-auto">
                    Search for your favorite artists above, pair off their tracks head-to-head using Elo pairwise ranking, and generate your ultimate ranked list.
                </p>
            </div>
        </div>

        <div id="tab-rank" class="view-tab hidden space-y-6">
            <h2 class="text-2xl font-bold text-center">Which track is better?</h2>
            <div id="matchupContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Pairwise matchup cards will render here dynamically -->
            </div>
        </div>

        <div id="tab-explore" class="view-tab hidden space-y-6">
            <h2 class="text-2xl font-bold mb-4">Ranked Results</h2>
            <div id="rankingsList" class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-2">
                <p class="text-slate-400 text-center py-4">No ranked tracks yet. Select an artist and complete a few matchups!</p>
            </div>
        </div>

    </main>

    <!-- App Logic Script -->
    <script>
        // -------------------------------------------------------------
        // CONFIGURATION & CLOUDFLARE WORKER PROXY INTEGRATION
        // -------------------------------------------------------------
        const WORKER_TOKEN_URL = 'https://songswipe-api.songswipper.workers.dev/api/spotify-token';

        const spotifyClient = {
            accessToken: null,

            async initToken() {
                try {
                    const response = await fetch(WORKER_TOKEN_URL);
                    const data = await response.json();
                    if (data.access_token) {
                        this.accessToken = data.access_token;
                        console.log("Spotify API authenticated via Cloudflare Worker proxy.");
                    } else {
                        console.warn("Could not fetch token from worker endpoint.");
                    }
                } catch (err) {
                    console.error("Error connecting to Cloudflare Worker:", err);
                }
            },

            async searchArtists(query) {
                if (!this.accessToken) {
                    await this.initToken();
                }
                if (!this.accessToken) return [];

                try {
                    const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=artist&limit=5`, {
                        headers: {
                            'Authorization': `Bearer ${this.accessToken}`
                        }
                    });
                    const data = await res.json();
                    return data.artists ? data.artists.items : [];
                } catch (err) {
                    console.error("Spotify Search Error:", err);
                    return [];
                }
            }
        };

        // -------------------------------------------------------------
        // UI & STATE HANDLERS
        // -------------------------------------------------------------
        let searchDebounceTimeout = null;

        function switchTab(tabName) {
            document.querySelectorAll('.view-tab').forEach(tab => tab.classList.add('hidden'));
            const selectedTab = document.getElementById(`tab-${tabName}`);
            if (selectedTab) selectedTab.classList.remove('hidden');
        }

        function handleSearchInput(e) {
            const query = e.target.value.trim();
            const resultsContainer = document.getElementById('searchResults');

            if (searchDebounceTimeout) clearTimeout(searchDebounceTimeout);

            if (!query) {
                resultsContainer.classList.add('hidden');
                resultsContainer.innerHTML = '';
                return;
            }

            searchDebounceTimeout = setTimeout(async () => {
                const artists = await spotifyClient.searchArtists(query);
                renderSearchResults(artists);
            }, 300);
        }

        function renderSearchResults(artists) {
    const container = document.getElementById('searchResults');
    container.innerHTML = '';

    if (!artists || artists.length === 0) {
        container.classList.add('hidden');
        return;
    }

    artists.forEach(artist => {
        const imageUrl = artist.images && artist.images.length > 0 
            ? artist.images[artist.images.length - 1].url 
            : 'https://via.placeholder.com/40';

        // Safely extract genres or default to 'Artist' if undefined or empty
        const genresText = (artist.genres && artist.genres.length > 0)
            ? artist.genres.slice(0, 2).join(', ')
            : 'Artist';

        const item = document.createElement('div');
        item.className = "flex items-center gap-3 p-3 hover:bg-slate-700 cursor-pointer transition-colors border-b border-slate-700/50 last:border-b-0";
        item.innerHTML = `
            <img src="${imageUrl}" alt="${artist.name}" class="w-10 h-10 rounded-full object-cover"/>
            <div>
                <div class="font-bold text-white">${artist.name}</div>
                <div class="text-xs text-slate-400">${genresText}</div>
            </div>
        `;
        item.onclick = () => selectArtist(artist);
        container.appendChild(item);
    });

    container.classList.remove('hidden');
}

        function selectArtist(artist) {
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('artistSearchInput').value = artist.name;
            alert(`Selected Artist: ${artist.name}. Loading albums and tracks for Elo ranking...`);
        }

        // Initialize token on application startup
        window.addEventListener('DOMContentLoaded', () => {
            spotifyClient.initToken();
        });
    </script>
</body>
</html>
